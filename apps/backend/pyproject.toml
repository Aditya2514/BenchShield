[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchshield"
version = "0.1.0"
description = "BenchShield core backend services, validation, contracts, and evaluation adapters"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "BenchShield Core Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/benchshield"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
]
