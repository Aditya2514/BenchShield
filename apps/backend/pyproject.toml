[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchshield"
version = "0.1.0"
description = "BenchShield core backend services, validation, contracts, and evaluation adapters"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "BenchShield Core Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.0",
    "cryptography>=42.0.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
    "tinyfish>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
    "jsonschema>=4.20.0",
    "embedded-postgres>=18.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/benchshield"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
]
