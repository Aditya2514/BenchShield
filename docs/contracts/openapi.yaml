openapi: 3.1.0
info:
  title: BenchShield Exposure Audit API
  version: 1.0.0
  description: Canonical API contract for BenchShield benchmark exposure audit product.
  license:
    name: Proprietary
    identifier: Proprietary
servers:
  - url: /api/v1
    description: Production & Mock Base URL
security:
  - BearerAuth: []
paths:
  /benchmarks:
    post:
      summary: Import benchmark items
      description: Validates benchmark CSV/JSON and stores immutable benchmark and item versions. Never returns gold answers.
      operationId: importBenchmark
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenchmarkImportRequest'
      responses:
        '201':
          description: Benchmark import processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkImportResponse'
        '400':
          description: Validation failed with row errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /policies:
    post:
      summary: Create immutable evaluation policy
      description: Defines allowed sources, cutoff date/timezone, and privacy constraints.
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyCreateRequest'
      responses:
        '201':
          description: Policy created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyResponse'
        '400':
          description: Invalid policy configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /investigations:
    post:
      summary: Launch an exposure investigation
      description: Dispatches investigation orchestrator. Requires Idempotency-Key.
      operationId: launchInvestigation
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigationLaunchRequest'
      responses:
        '202':
          description: Investigation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationResponse'
        '400':
          description: Launch validation failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Policy blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /investigations/{id}:
    get:
      summary: Get investigation status and summary
      operationId: getInvestigation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Investigation status details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationResponse'
        '404':
          description: Investigation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /investigations/{id}/cancel:
    post:
      summary: Cancel an investigation
      operationId: cancelInvestigation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cancellation processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationResponse'
        '404':
          description: Investigation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /investigations/{id}/findings:
    get:
      summary: Get independent exposure findings
      operationId: getFindings
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Paginated findings list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingsListResponse'
        '404':
          description: Investigation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /findings/{id}/reviews:
    post:
      summary: Append review decision with optimistic concurrency
      operationId: appendReviewDecision
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewDecisionRequest'
      responses:
        '200':
          description: Review decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingItem'
        '409':
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /investigations/{id}/experiments:
    get:
      summary: List optional controlled experiments
      operationId: listExperiments
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of experiments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentListResponse'
        '404':
          description: Investigation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create pinned optional attacker experiment
      operationId: createExperiment
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentCreateRequest'
      responses:
        '202':
          description: Experiment queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentItem'
        '400':
          description: Invalid experiment configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /investigations/{id}/reports:
    post:
      summary: Freeze report inputs and trigger report generation
      operationId: createReport
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Report generation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '400':
          description: Report generation precondition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reports/{id}:
    get:
      summary: Get report export status and download link
      operationId: getReport
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Report status and reference
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
        '404':
          description: Report not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BenchmarkImportRequest:
      type: object
      required:
        - benchmark_name
        - items
      properties:
        benchmark_name:
          type: string
        format:
          type: string
          enum: [csv, json]
          default: json
        items:
          type: array
          items:
            type: object
            required:
              - item_id
              - question
            properties:
              item_id:
                type: string
              question:
                type: string
              options:
                type: array
                items:
                  type: string
              reference_answer:
                type: string
                description: Protected gold answer uploaded in memory for vault ingestion; never returned in responses.

    BenchmarkImportResponse:
      type: object
      required:
        - benchmark_version_id
        - benchmark_name
        - total_rows
        - valid_rows
        - invalid_rows
        - row_errors
      properties:
        benchmark_version_id:
          type: string
        benchmark_name:
          type: string
        total_rows:
          type: integer
        valid_rows:
          type: integer
        invalid_rows:
          type: integer
        row_errors:
          type: array
          items:
            $ref: '#/components/schemas/RowError'

    RowError:
      type: object
      required:
        - row_number
        - item_id
        - error_code
        - message
      properties:
        row_number:
          type: integer
        item_id:
          type: string
        error_code:
          type: string
        message:
          type: string

    PolicyCreateRequest:
      type: object
      required:
        - cutoff_date
        - timezone
        - allowed_source_classes
        - prohibited_answer_key_access
        - benchmark_identification_permitted
        - budget_ceilings
        - reviewer_id
      properties:
        cutoff_date:
          type: string
          format: date
        timezone:
          type: string
          example: UTC
        allowed_source_classes:
          type: array
          items:
            type: string
            enum: [repository, research_web, conditional_mirror]
        prohibited_answer_key_access:
          type: boolean
        benchmark_identification_permitted:
          type: boolean
        budget_ceilings:
          $ref: '#/components/schemas/BudgetCeilings'
        reviewer_id:
          type: string

    PolicyResponse:
      type: object
      required:
        - policy_version_id
        - cutoff_date
        - timezone
        - allowed_source_classes
        - prohibited_answer_key_access
        - benchmark_identification_permitted
        - budget_ceilings
        - reviewer_id
        - created_at
        - immutable
      properties:
        policy_version_id:
          type: string
        cutoff_date:
          type: string
        timezone:
          type: string
        allowed_source_classes:
          type: array
          items:
            type: string
        prohibited_answer_key_access:
          type: boolean
        benchmark_identification_permitted:
          type: boolean
        budget_ceilings:
          $ref: '#/components/schemas/BudgetCeilings'
        reviewer_id:
          type: string
        created_at:
          type: string
          format: date-time
        immutable:
          type: boolean

    BudgetCeilings:
      type: object
      required:
        - max_search_queries_per_item
        - max_fetched_pages_per_item
        - max_deadline_seconds
        - monetary_ceiling_usd
      properties:
        max_search_queries_per_item:
          type: integer
        max_fetched_pages_per_item:
          type: integer
        max_deadline_seconds:
          type: integer
        monetary_ceiling_usd:
          type: number

    InvestigationLaunchRequest:
      type: object
      required:
        - benchmark_version_id
        - policy_version_id
      properties:
        benchmark_version_id:
          type: string
        policy_version_id:
          type: string

    InvestigationResponse:
      type: object
      required:
        - id
        - benchmark_version_id
        - policy_version_id
        - state
        - partial_coverage
        - coverage_limitations
        - counts
        - budget_usage
      properties:
        id:
          type: string
        benchmark_version_id:
          type: string
        policy_version_id:
          type: string
        state:
          type: string
          enum:
            - queued
            - validating
            - discovering
            - verifying
            - awaiting_review
            - completed
            - failed
            - cancelled
            - policy_blocked
            - budget_exhausted
        partial_coverage:
          type: boolean
        coverage_limitations:
          type: array
          items:
            type: string
        counts:
          type: object
          required:
            - total_items
            - processed_items
            - candidate_findings
            - verified_findings
          properties:
            total_items:
              type: integer
            processed_items:
              type: integer
            candidate_findings:
              type: integer
            verified_findings:
              type: integer
        budget_usage:
          type: object
          required:
            - queries_executed
            - pages_fetched
            - spend_usd
          properties:
            queries_executed:
              type: integer
            pages_fetched:
              type: integer
            spend_usd:
              type: number
        failure_reason:
          type: string

    FindingItem:
      type: object
      required:
        - id
        - investigation_id
        - item_id
        - item_version_id
        - claim_status
        - exposure_dimension
        - task_identity
        - answer_match
        - temporal_status
        - attribution
        - policy_compliance
        - evidence
        - version
      properties:
        id:
          type: string
        investigation_id:
          type: string
        item_id:
          type: string
        item_version_id:
          type: string
        claim_status:
          type: string
          enum: [candidate, verified, rejected, needs_review]
        exposure_dimension:
          type: string
          enum: [metadata, question_context, worked_solution, reference_answer]
        task_identity:
          type: string
          enum: [exact, equivalent, ambiguous, different]
        answer_match:
          type: string
          enum: [exact, normalized, task_specific, mismatch, not_applicable]
        temporal_status:
          type: string
          enum: [verified_pre_cutoff, observed_post_cutoff, verified_introduced_post_cutoff, unknown]
        attribution:
          type: string
          enum: [none, retrieval_observed, use_supported, intervention_supported]
        policy_compliance:
          type: string
          enum: [permitted, violated, unknown]
        evidence:
          $ref: '#/components/schemas/EvidenceSnapshot'
        review_decision:
          type: object
          properties:
            action:
              type: string
              enum: [confirmed, rejected, needs_more_evidence]
            reason:
              type: string
            reviewed_at:
              type: string
              format: date-time
            reviewer_id:
              type: string
        version:
          type: integer

    EvidenceSnapshot:
      type: object
      required:
        - snapshot_id
        - source_url
        - retrieval_time
        - content_hash
        - excerpt_text
      properties:
        snapshot_id:
          type: string
        source_url:
          type: string
        retrieval_time:
          type: string
          format: date-time
        content_hash:
          type: string
        excerpt_text:
          type: string
          description: Untrusted raw text excerpt. Must be rendered as escaped plain text only.

    FindingsListResponse:
      type: object
      required:
        - items
        - total
        - page
        - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FindingItem'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ReviewDecisionRequest:
      type: object
      required:
        - expected_version
        - action
        - reason
        - reviewer_id
      properties:
        expected_version:
          type: integer
        action:
          type: string
          enum: [confirmed, rejected, needs_more_evidence]
        reason:
          type: string
        reviewer_id:
          type: string

    ExperimentItem:
      type: object
      required:
        - experiment_id
        - investigation_id
        - condition
        - model_identifier
        - model_revision
        - status
        - completed_run_count
        - incomplete_run_count
        - correct_answer_count
        - prohibited_retrieval_count
        - attribution_strength
        - trajectories
      properties:
        experiment_id:
          type: string
        investigation_id:
          type: string
        condition:
          type: string
          enum: [control, blind, evaluation_aware]
        model_identifier:
          type: string
        model_revision:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled, policy_blocked, budget_exhausted]
        completed_run_count:
          type: integer
        incomplete_run_count:
          type: integer
        correct_answer_count:
          type: integer
        prohibited_retrieval_count:
          type: integer
        attribution_strength:
          type: string
          enum: [none, retrieval_observed, use_supported, intervention_supported]
        trajectories:
          type: array
          items:
            type: object
            required:
              - run_id
              - status
              - observable_tool_calls
              - grader_outcome
            properties:
              run_id:
                type: string
              status:
                type: string
              observable_tool_calls:
                type: array
                items:
                  type: string
              grader_outcome:
                type: string
                enum: [correct, incorrect, unsupported, error]

    ExperimentListResponse:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExperimentItem'

    ExperimentCreateRequest:
      type: object
      required:
        - condition
        - model_identifier
        - model_revision
      properties:
        condition:
          type: string
          enum: [control, blind, evaluation_aware]
        model_identifier:
          type: string
        model_revision:
          type: string

    ReportResponse:
      type: object
      required:
        - report_id
        - investigation_id
        - status
      properties:
        report_id:
          type: string
        investigation_id:
          type: string
        status:
          type: string
          enum: [queued, generating, completed, failed]
        report_version_id:
          type: string
        frozen_at:
          type: string
          format: date-time
        download_url:
          type: string
        download_expires_at:
          type: string
          format: date-time
        reviewer_decisions_count:
          type: integer
        unresolved_claims_count:
          type: integer
        limitations:
          type: array
          items:
            type: string
        error_code:
          type: string

    ErrorResponse:
      type: object
      required:
        - error_code
        - message
      properties:
        error_code:
          type: string
          enum:
            - validation_failed
            - policy_blocked
            - budget_exhausted
            - provider_unavailable
            - unsupported_grader
            - not_found
            - version_conflict
            - export_failed
        message:
          type: string
        details:
          type: object
          additionalProperties: true

