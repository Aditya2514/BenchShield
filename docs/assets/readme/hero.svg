<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="BenchShield — exposure audits for AI benchmarks">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B1A"/>
      <stop offset="0.55" stop-color="#0E1736"/>
      <stop offset="1" stop-color="#1B0F3D"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#818CF8;#C084FC;#22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#22D3EE;#818CF8;#C084FC" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E2A5A" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0B1230" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="shieldClip">
      <path d="M260 92 L360 128 V212 C360 276 318 318 260 340 C202 318 160 276 160 212 V128 Z"/>
    </clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      .title { font: 800 84px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; letter-spacing: -2px; }
      .sub { font: 600 26px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #CBD5E1; }
      .tag { font: 500 21px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #67E8F9; }
      .chip { font: 600 14px 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #E2E8F0; letter-spacing: 0.5px; }
      .doc { fill: #1E293B; stroke: #475569; stroke-width: 1.2; }
      .docline { stroke: #64748B; stroke-width: 2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <g>
    <rect x="-40" y="-40" width="1280" height="500" fill="url(#grid)"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;40 40" dur="6s" repeatCount="indefinite"/>
  </g>
  <circle cx="260" cy="215" r="210" fill="url(#glow)"/>
  <circle cx="980" cy="60" r="160" fill="#C084FC" opacity="0.08" filter="url(#soft)"/>

  <!-- drifting documents being pulled into the shield -->
  <g opacity="0.9">
    <g opacity="0">
      <rect class="doc" x="-14" y="-18" width="28" height="36" rx="4"/>
      <line class="docline" x1="-7" y1="-8" x2="7" y2="-8"/><line class="docline" x1="-7" y1="0" x2="7" y2="0"/><line class="docline" x1="-7" y1="8" x2="3" y2="8"/>
      <animateMotion dur="7s" repeatCount="indefinite" path="M40 60 Q120 120 250 215"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="7s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect class="doc" x="-14" y="-18" width="28" height="36" rx="4"/>
      <line class="docline" x1="-7" y1="-8" x2="7" y2="-8"/><line class="docline" x1="-7" y1="0" x2="7" y2="0"/><line class="docline" x1="-7" y1="8" x2="3" y2="8"/>
      <animateMotion dur="8s" begin="2.3s" repeatCount="indefinite" path="M30 380 Q110 300 255 220"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="8s" begin="2.3s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect class="doc" x="-14" y="-18" width="28" height="36" rx="4"/>
      <line class="docline" x1="-7" y1="-8" x2="7" y2="-8"/><line class="docline" x1="-7" y1="0" x2="7" y2="0"/><line class="docline" x1="-7" y1="8" x2="3" y2="8"/>
      <animateMotion dur="7.5s" begin="4.6s" repeatCount="indefinite" path="M500 30 Q420 110 270 210"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="7.5s" begin="4.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- pulse rings -->
  <circle cx="260" cy="215" r="120" fill="none" stroke="#22D3EE" stroke-width="2">
    <animate attributeName="r" values="115;190" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="260" cy="215" r="120" fill="none" stroke="#A78BFA" stroke-width="2">
    <animate attributeName="r" values="115;190" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- shield -->
  <path d="M260 92 L360 128 V212 C360 276 318 318 260 340 C202 318 160 276 160 212 V128 Z" fill="url(#shieldFill)" stroke="url(#brand)" stroke-width="5" stroke-linejoin="round"/>
  <g clip-path="url(#shieldClip)">
    <rect x="150" y="80" width="220" height="40" fill="url(#scan)">
      <animate attributeName="y" values="70;320;70" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <g stroke="#38BDF8" stroke-opacity="0.18" stroke-width="1">
      <line x1="160" y1="160" x2="360" y2="160"/><line x1="160" y1="200" x2="360" y2="200"/>
      <line x1="160" y1="240" x2="360" y2="240"/><line x1="160" y1="280" x2="360" y2="280"/>
    </g>
  </g>
  <!-- magnifier + check drawn on loop -->
  <circle cx="248" cy="200" r="38" fill="none" stroke="#E0F2FE" stroke-width="7"/>
  <line x1="276" y1="228" x2="306" y2="258" stroke="#E0F2FE" stroke-width="9" stroke-linecap="round"/>
  <path d="M230 201 L244 215 L268 188" fill="none" stroke="#4ADE80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60" stroke-dashoffset="60">
    <animate attributeName="stroke-dashoffset" values="60;0;0;60" keyTimes="0;0.25;0.85;1" dur="4s" repeatCount="indefinite"/>
  </path>

  <!-- wordmark -->
  <text x="440" y="178" class="title" fill="url(#brand)">BenchShield</text>
  <text x="444" y="222" class="sub">Exposure audits for AI benchmarks</text>

  <!-- rotating taglines -->
  <g class="tag">
    <text x="444" y="276" opacity="0">› discover public copies of evaluation material
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.28;0.33;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="444" y="276" opacity="0">› verify what those copies actually reveal
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.39;0.61;0.66;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="444" y="276" opacity="0">› test whether browsing agents exploit them
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.72;0.94;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <rect x="444" y="284" width="12" height="3" fill="#67E8F9">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- chips -->
  <g transform="translate(444 318)">
    <rect width="150" height="34" rx="17" fill="#0F172A" stroke="#22D3EE" stroke-opacity="0.5"/>
    <text x="75" y="22" text-anchor="middle" class="chip">EVIDENCE-FIRST</text>
    <rect x="162" width="150" height="34" rx="17" fill="#0F172A" stroke="#818CF8" stroke-opacity="0.5"/>
    <text x="237" y="22" text-anchor="middle" class="chip">VAULT-ISOLATED</text>
    <rect x="324" width="184" height="34" rx="17" fill="#0F172A" stroke="#C084FC" stroke-opacity="0.5"/>
    <text x="416" y="22" text-anchor="middle" class="chip">DURABLE &amp; BOUNDED</text>
    <rect x="520" width="168" height="34" rx="17" fill="#0F172A" stroke="#4ADE80" stroke-opacity="0.5"/>
    <text x="604" y="22" text-anchor="middle" class="chip">HUMAN-REVIEWED</text>
  </g>
</svg>
