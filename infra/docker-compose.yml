services:
  postgres:
    image: postgres:16-alpine
    container_name: benchshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: benchshield
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d benchshield"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
